name: CI Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/web-app:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/web-app:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ secrets.GHCR_USERNAME }}/web-app:${{ env.IMAGE_TAG }}|g" k8s/web.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/web.yaml
          git commit -m "Update image to ${{ env.IMAGE_TAG }}"
          git push
